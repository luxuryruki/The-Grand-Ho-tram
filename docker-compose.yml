services:
  postgres:
    image: postgres:16-alpine
    container_name: the-grand-web-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thegrandweb
    ports:
      - "5432:5432"
    volumes:
      - grand_web_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grand_web_pgdata:
